[project]
name = "custom-mcp-server"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "mcp==1.26.0",
  "databricks-mcp",
  "fastmcp>=2.14.5",
]

[project.scripts]
custom-server = "server.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
