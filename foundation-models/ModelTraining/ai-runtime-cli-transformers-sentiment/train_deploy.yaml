# AI Runtime CLI workload: fine-tune DistilBERT on GPU, then deploy to serving.
# Submit with: COPYFILE_DISABLE=1 air run --file train_deploy.yaml --watch -p my-workspace

experiment_name: ai-runtime-cli-transformers-sentiment

# Serverless GPU compute for the fine-tuning step.
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10   # also valid: GPU_1xH100, GPU_8xH100

environment:
  version: '4'
  dependencies:
    - torch
    - transformers
    - datasets
    - accelerate
    - mlflow
    - databricks-sdk

code_source:
  type: snapshot
  snapshot:
    root_path: .

# air runs ONE job task per workload, so the two steps run sequentially here:
#   step 1: fine-tune + register the model on the GPU
#   step 2: deploy the registered model to a Model Serving endpoint
# `set -e` ensures deploy is skipped if training fails.
#
# Config lives in the exports below — the single source of truth both scripts
# read via their env-var defaults. Change these to reproduce in any workspace;
# no code edits needed.
command: |
  set -e
  export MODEL_NAME=main.default.distilbert_sentiment    # <catalog>.<schema>.<model> you can write to
  export ENDPOINT_NAME=air-transformers-sentiment
  export MODEL_ALIAS=champion                             # train.py tags this version; deploy.py resolves it
  export WORKLOAD_SIZE=Small                              # smallest workload size
  export SCALE_TO_ZERO=true                               # endpoint costs nothing while idle
  python $CODE_SOURCE_PATH/train.py
  python $CODE_SOURCE_PATH/deploy.py
