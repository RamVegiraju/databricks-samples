[project]
name = "agent-app"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
  "mlflow>=3.0.0",
  "langchain-core>=0.3.0",
  "langchain-databricks>=0.4.0",
  "langgraph>=0.3.0",
  "databricks-sdk>=0.40.0",
  "databricks-mcp>=0.3.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "psycopg2-binary>=2.9.0",
]

[project.scripts]
start-server = "start_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
