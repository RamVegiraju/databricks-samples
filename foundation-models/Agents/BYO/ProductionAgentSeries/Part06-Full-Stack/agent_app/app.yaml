command: ["uv", "run", "python", "start_server.py"]

env:
  # ── Static values (safe to commit, not sensitive) ─────────────────────────
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: AGENT_LLM_ENDPOINT
    value: "databricks-claude-sonnet-4-6"
  - name: AGENT_LLM_TEMPERATURE
    value: "0.1"
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: "databricks-bge-large-en"
  - name: EMBEDDING_DIMS
    value: "1024"

  # ── Fill in before deploying ───────────────────────────────────────────────
  # URL of the deployed mcp_server/ app — available after Step 5 of setup
  - name: MCP_SERVER_URL
    value: "https://part06-mcp-server-2556758628403379.aws.databricksapps.com/mcp"

  # ── Lakebase instance name (short name, not the connection hostname) ──────
  - name: LAKEBASE_INSTANCE_NAME
    value: "part06-agent-memory"
